name: Build

# Builds the APK on pushes and pull requests to main and stable. A push to main publishes a dev
# pre-release and a push to stable publishes a release, both with the signed APK. A push that only
# changes documentation files does nothing.

on:
  push:
    branches: [main, stable]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore', 'docs/**']
  pull_request:
    branches: [main, stable]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ steps.build.outputs.signed }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;35.0.0" || echo "sdkmanager step skipped, using the preinstalled SDK"

      - name: Check translations
        run: python3 tools/check_translations.py

      - name: Build
        id: build
        env:
          EVENT: ${{ github.event_name }}
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          if [ "$EVENT" = "push" ] && [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            export KEYSTORE="$RUNNER_TEMP/signing.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            unset KS_PASS
            echo "::warning::No signing key available: building with a throwaway key (this APK cannot update an app signed with your own key)"
          fi
          # the build's name: dev-N from main, stable-N from stable, anything else is not a release build
          case "$EVENT:$GITHUB_REF_NAME" in
            push:stable) CHANNEL=stable ;;
            push:main) CHANNEL=dev ;;
            *) CHANNEL="build-${GITHUB_REF_NAME//\//-}" ;;
          esac
          export VERSION_NAME="${CHANNEL}-${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          ./build.sh
          # the update check identifies a build by this name, so a wrong one must fail the build
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt2" dump badging TripRecorderNG.apk | grep -q "versionName='$VERSION_NAME'" \
            || { echo "::error::the APK's version name is not $VERSION_NAME"; exit 1; }
          mkdir -p dist
          cp TripRecorderNG.apk "dist/TripRecorderNG-${VERSION_NAME}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: TripRecorderNG-${{ github.run_number }}
          path: dist/*.apk
          retention-days: ${{ github.ref == 'refs/heads/stable' && 90 || 14 }}

  release:
    # only for pushes to main and stable, and only for APKs signed with the real key
    needs: build
    if: >-
      github.event_name == 'push' && needs.build.outputs.signed == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TripRecorderNG-${{ github.run_number }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          case "$VERSION" in stable-*) KIND=(--latest) ;; *) KIND=(--prerelease) ;; esac
          gh release create "$VERSION" dist/*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Trip Recorder NG ${VERSION%-*} build ${VERSION##*-}" "${KIND[@]}" --generate-notes \
            --notes "After installing, turn Trip Recorder NG OFF in the car's Disable background Apps list and restart the head unit once (BYD resets that switch on every install). Unofficial, use at your own risk: see the README."
